name: Repository-Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static repository safety and source checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python syntax, references and excluded files
        run: python3 scripts/check_repository.py
      - name: Unit tests for repository checks
        run: python3 -m unittest discover -s tests -v
